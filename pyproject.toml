[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "csvpulse"
version = "0.1.0"
description = "Take the pulse of a CSV file — column types, fill rate, uniques, numeric ranges, top values, ragged and duplicate rows in one command"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
keywords = ["csv", "data-quality", "profiling", "cli", "developer-tools", "data-engineering"]
authors = [{ name = "doge-th" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Utilities",
]

[project.scripts]
csvpulse = "csvpulse.cli:main"

[project.urls]
Homepage = "https://github.com/doge-th/csvpulse"
Issues = "https://github.com/doge-th/csvpulse/issues"

[tool.setuptools]
packages = ["csvpulse"]
